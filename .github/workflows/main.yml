name: OKTrading Predictor Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          OKTRADING_EMAIL: ${{ secrets.OKTRADING_EMAIL }}
          OKTRADING_PASSWORD: ${{ secrets.OKTRADING_PASSWORD }}
        run: python -u bot.py
